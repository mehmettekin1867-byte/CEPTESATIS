 <!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cepte Satış</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* GİRİŞ */
.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#111827,#2563eb);
}

.login-card{
  background:white;
  width:min(92%,400px);
  padding:30px;
  border-radius:20px;
  box-shadow:0 20px 50px #0004;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:5px;
}

.logo span{
  color:#2563eb;
}

.login-card p{
  text-align:center;
  color:#64748b;
}

.field{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:10px;
  margin:7px 0;
}

.btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold;
}

.btn:hover{
  background:#1d4ed8;
}

.btn-danger{
  background:#dc2626;
}

.btn-green{
  background:#16a34a;
}

/* UYGULAMA */
#app{
  display:none;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:230px;
  background:#111827;
  color:white;
  padding:20px 12px;
}

.side-logo{
  font-size:24px;
  font-weight:900;
  padding:10px;
  margin-bottom:20px;
}

.side-logo span{
  color:#60a5fa;
}

.menu-btn{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  color:#dbeafe;
  background:transparent;
  padding:13px 14px;
  border-radius:10px;
  margin-bottom:6px;
}

.menu-btn:hover,
.menu-btn.active{
  background:#2563eb;
  color:white;
}

.content{
  margin-left:230px;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #00000010;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px #00000010;
}

.stat strong{
  font-size:28px;
  display:block;
  margin-top:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f8fafc;
}

.actions{
  display:flex;
  gap:6px;
}
