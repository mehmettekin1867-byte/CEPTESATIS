plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("CEPTESATIS_KEYSTORE")
def keystorePassword = System.getenv("CEPTESATIS_KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("CEPTESATIS_KEY_ALIAS")
def keyPasswordValue = System.getenv("CEPTESATIS_KEY_PASSWORD")
def hasReleaseSigning = keystorePath && keystorePassword && keyAliasName && keyPasswordValue

android {
    namespace 'com.ceptesatis.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.ceptesatis.mobile"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.4"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
